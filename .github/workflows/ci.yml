name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 빌드리스 프로젝트: npm install/실행/API 호출 없음. 정적 검증만.
      - name: node --check (root + ai/ + server/)
        run: |
          for f in $(find . -path ./node_modules -prune -o \( -name '*.mjs' -o -name '*.js' \) -print); do
            echo "check $f"
            node --check "$f"
          done

      - name: Run check.mjs (JSON + brew unit tests + AI mock + security)
        run: node check.mjs
